worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    scgi_temp_path /tmp/scgi;
    uwsgi_temp_path /tmp/uwsgi;
    limit_req_zone $binary_remote_addr zone=client:1m rate=2r/s;
    limit_req_zone $server_name zone=site:1m rate=5r/s;
    limit_conn_zone $server_name zone=connections:1m;
    server {
        listen 8080;
        client_max_body_size 32k;
        client_body_buffer_size 64k;
        client_body_timeout 3s;
        client_header_timeout 3s;
        keepalive_timeout 3s;
        location = /api/scan {
            limit_req zone=client burst=3 nodelay;
            limit_req zone=site burst=5 nodelay;
            limit_req_status 429;
            limit_conn connections 8;
            if ($http_transfer_encoding != "") { return 411; }
            proxy_read_timeout 7s;
            proxy_pass http://unix:/run/scan/api.sock;
        }
        location / { return 404; }
    }
}
