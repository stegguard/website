name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The docs page reads ../stegguard-oss/docs at build time, so check out
      # both repos side by side, mirroring the local layout.
      - uses: actions/checkout@v4
        with:
          path: stegguard-site
      - uses: actions/checkout@v4
        with:
          repository: stegguard/stegguard
          path: stegguard-oss
          # Needed only if stegguard/stegguard is private:
          # token: ${{ secrets.OSS_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: stegguard-site/.nvmrc
          cache: npm
          cache-dependency-path: stegguard-site/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Build
        working-directory: stegguard-site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: stegguard-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
